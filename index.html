<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <title>Letter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
    rel="stylesheet" />

  <style>
    /* Стили для счетчика */
    #counter-container {
      position: fixed;
      bottom: 20px; /* Отступ снизу */
      left: 50%;
      transform: translateX(-50%);
      color: #d95a5a;
      font-size: 20px;
      text-align: center;
      z-index: 100;
      background: rgba(255, 240, 240, 0.8);
      padding: 10px 20px;
      border-radius: 15px;
      border: 3px solid #d95a5a;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 80%;
      max-width: 350px;
    }
    #time-counter {
      margin-top: 5px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="envelope-container">
    <img src="envelope.png" alt="Envelope" id="envelope" />
    <p>♡ Letter for You ♡</p>
  </div>

  <div id="letter-container">
    <div class="letter-window">
      <h1 id="letter-title">Do you love me?</h1>

      <img src="cat_heart.gif" class="cat" id="letter-cat" />

      <div class="buttons" id="letter-buttons">
        <img src="yes.png" class="btn yes-btn" alt="Yes" />

        <div class="no-wrapper">
          <img src="no.png" class="btn no-btn" alt="No" />
        </div>
      </div>

      <p id="final-text" class="final-text" style="display: none">
        <strong>You are ready? <span id="countdown">7</span></strong>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
