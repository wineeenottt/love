<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surprise</title>

  <link rel="stylesheet" href="style.css" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />

  <style>
    body {
      height: auto !important; 
      min-height: 100vh;
      align-items: flex-start !important; 
      padding: 40px 0; 
      margin: 0;
      overflow-x: hidden;
    }

    .next-page-content {
      text-align: center;
      max-width: 100%;
      margin: 0 auto; 
    }

    .header-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px; 
      margin-bottom: 20px;
      padding: 0 20px;
      background: rgba(255, 240, 240, 0.9);
      border: 3px solid #d95a5a;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 80%;
      max-width: 350px;
      margin: 0 auto 20px auto;

    }

    h1 {
      color: #d95a5a;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
      margin: 0;
    }

    .heart-btn {
      font-size: 50px; 
      cursor: pointer;
      display: inline-block;
      animation: heartPulse 1.5s infinite;
      user-select: none;
      transition: transform 0.2s ease;
    }
    
    .heart-btn:active {
      transform: scale(0.9);
    }

    @keyframes heartPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .photo-gallery {
      display: flex;
      gap: 20px; 
      padding: 20px 20px 120px 20px; 
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      
      -ms-overflow-style: none;  
      scrollbar-width: none;  
    }
    .photo-gallery::-webkit-scrollbar {
      display: none; 
    }

    .photo-gallery img {
      flex-shrink: 0;
      height: 450px; 
      width: 470px; 
      max-width: 80vw; 
      object-fit: cover; 
      scroll-snap-align: center; 
      
      border-radius: 12px; 
      border: 4px solid #d95a5a; 
      background-color: white; 
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); 
    }

    .popup-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .popup-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-content {
      background-color: white;
      padding: 40px;
      border-radius: 20px;
      max-width: 400px;
      width: 80%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transform: translateY(-30px);
      transition: transform 0.3s ease;
    }

    .popup-overlay.active .popup-content {
      transform: translateY(0);
    }

    .popup-text {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
      font-family: sans-serif;
    }

    .close-btn {
      background-color: #d95a5a;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      font-family: inherit;
    }

    #counter-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #d95a5a;
      font-size: 18px;
      text-align: center;
      z-index: 100;
      background: rgba(255, 240, 240, 0.9);
      padding: 10px 20px;
      border-radius: 15px;
      border: 3px solid #d95a5a;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 80%;
      max-width: 350px;
      font-family: "Pixelify Sans", sans-serif; 
    }
    
    #time-counter {
      margin-top: 5px;
      font-weight: bold;
      font-size: 20px;
    }
    .photo-gallery img[alt="Photo 14"],
    .photo-gallery img[alt="Photo 16"] {
        height: 550px;
    }
  </style>
</head>
<body>

  <div class="next-page-content">
    
    <div class="header-container">
      <h1>I love you so much!</h1>
      <div class="heart-btn" id="heart-btn">❤️</div>
    </div>

    <div class="photo-gallery">
      <img src="14.jpg" alt="Photo 14">
      <img src="7.jpg" alt="Photo 7">
      <img src="3.jpg" alt="Photo 3">
      <img src="4.jpg" alt="Photo 4">
      <img src="5.jpg" alt="Photo 5">
      <img src="6.jpg" alt="Photo 6"> 
      <img src="8.jpg" alt="Photo 8">
      <img src="2.jpg" alt="Photo 2">
      <img src="9.jpg" alt="Photo 9">
      <img src="10.jpg" alt="Photo 10">
      <img src="12.jpg" alt="Photo 12">
      <img src="13.jpg" alt="Photo 13">
      <img src="16.jpg" alt="Photo 16">
    </div>
  </div>

  <div id="counter-container">
    <div>Мы вместе уже:</div>
    <div id="time-counter">Считаем...</div>
  </div>

  <div class="popup-overlay" id="popup-overlay">
    <div class="popup-content">
      <div class="popup-text">
        Ты самое дорогое, что у меня есть! ❤️<br><br>
        Спасибо за каждый момент вместе.
        Я очень соскучилась :(
      </div>
      <button class="close-btn" id="close-btn">Закрыть</button>
    </div>
  </div>

  <script>
    const heartBtn = document.getElementById('heart-btn');
    const popupOverlay = document.getElementById('popup-overlay');
    const closeBtn = document.getElementById('close-btn');

    heartBtn.addEventListener('click', () => {
      popupOverlay.classList.add('active');
    });

    closeBtn.addEventListener('click', () => {
      popupOverlay.classList.remove('active');
    });

    popupOverlay.addEventListener('click', (event) => {
      if (event.target === popupOverlay) {
        popupOverlay.classList.remove('active');
      }
    });

    const startDate = new Date("2025-12-07T00:00:00"); 

    function updateCounter() {
      const now = new Date();
      let diff = now - startDate;

      if (diff < 0) diff = Math.abs(diff); 

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("time-counter").innerHTML = 
        `${days} дн. ${hours} ч. ${minutes} мин. ${seconds} сек.`;
    }

    setInterval(updateCounter, 1000);
    updateCounter(); 
  </script>

</body>
</html>
